[package]
name = "lawfirm_agents"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
futures-core = "0.3.31"
futures-util = "0.3.31"
opensearch = "2.3.0"
reqwest = {version="0.12.15", features=["json", "stream"]}
serde = "1.0.219"
serde_json = "1.0.140"
tokio = {version = "*", features = ["full"]}
tokio-macros = "2.5.0"
tokio-stream = "0.1.17"

[[bin]]
name = "main"
default = true
path = "src/main.rs"

[[bin]]
name = "topic_selector"
path = "src/agents/topic_selector.rs"

[[bin]]
name = "text_query_builder"
path = "src/agents/text_query_builder.rs"
